name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y php-cli libxml2-utils shellcheck yara

      - name: PHP syntax
        run: |
          find security -type f \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l >/dev/null
          php -l security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/apply.php >/dev/null

      - name: Python syntax
        run: |
          python3 -m py_compile security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/stats.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/feed_update.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/geo.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/audit.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/dlp_rules.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/icap_server.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/inspection.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/avscan.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/live.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/auth.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/portal.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/signatures.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/cloudlib.py \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/cfs.py \
            cloud/server/build_feeds.py cloud/server/feedserver.py

      - name: XML well-formed
        run: find security -name '*.xml' -print0 | xargs -0 -n1 xmllint --noout

      - name: Shell scripts
        run: |
          shellcheck -S warning -s sh -e SC1091,SC2034,SC2086,SC2155 \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/catalog.sh \
            security/layer7security/src/etc/rc.d/layer7security \
            security/layer7security/src/etc/rc.d/layer7security_proxy \
            security/layer7security/src/etc/rc.d/layer7security_portal \
            security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security/webexpire.sh \
            cloud/install.sh

      - name: Own YARA signatures compile and find the EICAR test file
        run: |
          for f in cloud/data/yara/*.yar; do yarac "$f" /tmp/out.yarc; done
          python3 -c "open('/tmp/eicar.com','w').write('X5O!P%@AP[4' + chr(92) + 'PZX54(P^)7CC)7}\$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!\$H+H*')"
          yarac cloud/data/yara/basic.yar /tmp/basic.yarc
          yara -C /tmp/basic.yarc /tmp/eicar.com | grep -q L7_EICAR_Test_File

      - name: GeoIP range arithmetic self-test
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, 'security/layer7security/src/opnsense/scripts/OPNsense/Layer7Security')
          import geo
          # subtract a hole from a range, merge neighbours, convert to CIDRs
          assert geo.subtract([(0, 255)], [(10, 19)]) == [(0, 9), (20, 255)]
          assert geo.subtract([(0, 255)], [(0, 255)]) == []
          assert geo.merge([(5, 9), (0, 4), (20, 30)]) == [(0, 9), (20, 30)]
          assert list(geo.to_cidrs([(0, 255)], False)) == ['0.0.0.0/24']
          r4, r6 = geo.net_ranges(['10.0.0.0/8', 'fc00::/7', 'bogus'])
          assert r4 == [(167772160, 184549375)] and len(r6) == 1
          text = chr(10).join([chr(9).join(['1.0.0.0', '1.0.0.255', 'US']),
                               chr(9).join(['1.0.1.0', '1.0.3.255', 'None']),
                               chr(9).join(['9.9.9.9', '9.9.9.1', 'DE'])])
          rows = geo.normalise(text, False)
          assert rows == [(16777216, 16777471, 'US')], rows
          print('ok')
          EOF

      - name: Unit tests (detectors, audit log, ICAP scanner, antivirus, live sessions, sign-in, cloud feeds)
        run: python3 -m unittest tests/test_dlp.py tests/test_audit.py tests/test_icap.py tests/test_av.py tests/test_live.py tests/test_auth.py tests/test_cloud.py

      - name: No secrets in tree
        run: |
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY'; then
            echo 'secret-looking content found'; exit 1
          fi

  engine-freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the engine on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: |
            pkg install -y ndpi sqlite3 gmake pkgconf
          run: |
            cd engine
            make
            ./l7engine --version
            ./l7engine --list-apps | head -c 300
            ./l7engine --list-categories | head -c 200
            make check
