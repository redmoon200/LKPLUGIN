[start]
command:/usr/local/etc/rc.d/layer7security start
parameters:
type:script
message:starting layer7security

[stop]
command:/usr/local/etc/rc.d/layer7security onestop; exit 0
parameters:
type:script
message:stopping layer7security

[restart]
command:/usr/local/etc/rc.d/layer7security onerestart
parameters:
type:script
message:restarting layer7security

[status]
command:/usr/local/etc/rc.d/layer7security onestatus; exit 0
parameters:
type:script_output
message:layer7security status

[apply]
command:/usr/local/opnsense/scripts/OPNsense/Layer7Security/apply.php
parameters:
type:script_output
message:applying layer7security configuration

[catalog]
command:/usr/local/opnsense/scripts/OPNsense/Layer7Security/catalog.sh
parameters:
type:script_output
message:rebuilding layer7security application catalog

[stats]
command:/usr/local/opnsense/scripts/OPNsense/Layer7Security/stats.py
parameters:%s %s
type:script_output
message:layer7security statistics

[flows]
command:/usr/local/opnsense/scripts/OPNsense/Layer7Security/stats.py flows
parameters:%s %s %s %s %s
type:script_output
message:layer7security flows

[events]
command:/usr/local/opnsense/scripts/OPNsense/Layer7Security/stats.py events
parameters:%s
type:script_output
message:layer7security events

[engine-status]
command:/usr/local/opnsense/scripts/OPNsense/Layer7Security/stats.py engine
parameters:
type:script_output
message:layer7security engine status

[feed-update]
command:/usr/local/opnsense/scripts/OPNsense/Layer7Security/feed_update.py update
parameters:
type:script_output
message:updating layer7security DNS feeds

[feed-update-auto]
command:/usr/local/opnsense/scripts/OPNsense/Layer7Security/feed_update.py auto
parameters:
type:script_output
message:updating layer7security DNS feeds (scheduled)

[dns-status]
command:/usr/local/opnsense/scripts/OPNsense/Layer7Security/feed_update.py status
parameters:
type:script_output
message:layer7security DNS list status

[dns-schedule]
command:/usr/local/opnsense/scripts/OPNsense/Layer7Security/apply.php --dns-only
parameters:
type:script
message:re-evaluating layer7security DNS schedules

[log-tail]
command:tail -n 8 /var/log/layer7security.log; exit 0
parameters:
type:script_output
message:layer7security engine log
